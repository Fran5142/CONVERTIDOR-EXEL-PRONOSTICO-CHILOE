<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronóstico Chiloé Oriental → Excel</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* --- IDENTIDAD VISUAL: NAVY & GOLD PROFESSIONAL --- */
:root {
  --navy-primary: #001d3d;
  --navy-secondary: #003566;
  --gold-accent: #ffc300;
  --gold-hover: #ffd60a;
  --text-white: #ffffff;
  --text-gray: #a3bac3;
  --pure-white: #ffffff;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: var(--navy-primary);
  background-image: radial-gradient(circle at top right, #003566 0%, #000814 100%);
  color: var(--text-white);
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 850px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 195, 0, 0.2);
  border-radius: 16px;
  padding: 40px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(12px);
}

.header-section {
  text-align: center;
  margin-bottom: 30px;
}

h2 {
  color: var(--gold-accent);
  font-size: 28px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin: 0 0 10px 0;
  border-bottom: 2px solid var(--gold-accent);
  display: inline-block;
  padding-bottom: 5px;
}

p {
  color: var(--text-gray);
  font-size: 14px;
  margin: 10px 0;
}

textarea {
  width: 100%;
  height: 280px;
  background-color: var(--pure-white);
  color: #1a1a1a;
  border: none;
  padding: 20px;
  border-radius: 8px;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 14px;
  line-height: 1.6;
  resize: none;
  box-sizing: border-box;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  margin-bottom: 25px;
}

textarea:focus {
  outline: 3px solid var(--gold-accent);
}

.controls-card {
  background: var(--navy-secondary);
  padding: 25px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  border: 1px solid rgba(255, 195, 0, 0.1);
}

.file-input-wrapper {
  width: 100%;
  max-width: 400px;
  text-align: center;
}

input[type="file"] {
  width: 100%;
  color: var(--text-gray);
  background: rgba(255,255,255,0.05);
  padding: 10px;
  border-radius: 6px;
  border: 1px dashed var(--gold-accent);
}

button {
  background: var(--gold-accent);
  color: var(--navy-primary);
  border: none;
  padding: 16px 45px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: var(--gold-hover);
  transform: translateY(-2px);
}

.firma {
  margin-top: 30px;
  text-align: center;
  font-size: 12px;
  color: var(--text-gray);
  border-top: 1px solid rgba(163, 186, 195, 0.2);
  padding-top: 15px;
}
</style>
</head>

<body>

<div class="container">
  <div class="header-section">
    <h2>Chiloé Oriental</h2>
    <p>Ingreso de Datos para Conversión a Formato Excel</p>
  </div>

  <textarea id="texto" placeholder="Pegue aquí el informe meteorológico marítimo..."></textarea>
  
  <div class="controls-card">
    <div class="file-input-wrapper">
      <p style="margin-bottom: 8px; font-weight: bold; color: var(--gold-accent);">1. Seleccione plantilla Excel:</p>
      <input type="file" id="excel" accept=".xlsx">
    </div>
    <button onclick="procesar()">Ejecutar Procesamiento</button>
  </div>

  <div class="firma">
    <strong>SISTEMA DE PROCESAMIENTO METEOROLÓGICO</strong><br>
    Creado por Cabo 1º (Met.) Francisco Salas Muñoz - 03/02/2026
  </div>
</div>

<script>
// --- FUNCIÓN DE LIMPIEZA REFORZADA ---
function limpiarTextoPro(t, etiquetaAEliminar = "") {
  if (!t) return "";

  // Corrección manual de caracteres mal codificados (Solución definitiva para "CUÑA")
  let mapaCorrecion = {
    "Ã‘": "Ñ", "Ã±": "ñ", "Ã ": "Á", "Ã¡": "á", "Ã‰": "É", "Ã©": "é",
    "Ã ": "Í", "Ã­": "í", "Ã“": "Ó", "Ã³": "ó", "Ãš": "Ú", "Ãº": "ú"
  };
  
  Object.keys(mapaCorrecion).forEach(key => {
    t = t.split(key).join(mapaCorrecion[key]);
  });

  let limpio = t.replace(/\r?\n|\r/g, " ").replace(/\s+/g, " ").trim();
  
  if (etiquetaAEliminar) {
    const regexEtiqueta = new RegExp("^" + etiquetaAEliminar + "\\s+", "i");
    limpio = limpio.replace(regexEtiqueta, "");
  }
  
  limpio = limpio.replace(/MET\d+[A-Z]+/gi, "").trim();
  return limpio.replace(/[.,]$/, "").trim();
}

function limpiarBasuraZonas(t) {
  let limpio = t.replace(/PUERTO MONTT A ISLA BUTA CHAUQUES.*|ISLA BUTA CHAUQUES A ISLA SAN PEDRO.*|BOCA DEL GUAFO Y GOLFO CORCOVADO.*|MET\d+[A-Z]+/gi, "").trim();
  
  // También aplicamos la corrección aquí por si acaso
  let mapaCorrecion = { "Ã‘": "Ñ", "Ã±": "ñ" };
  Object.keys(mapaCorrecion).forEach(key => {
    limpio = limpio.split(key).join(mapaCorrecion[key]);
  });

  limpio = limpio.replace(/^MAR\s+/i, "");
  return limpio.replace(/[.,]$/, "").trim();
}

function procesar() {
  const areaTexto = document.getElementById("texto");
  const fullText = areaTexto.value;
  const archivo = document.getElementById("excel").files[0];

  if (!fullText || !archivo) {
    alert("Por favor, ingresa el texto y el archivo Excel.");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, { type: "array" });
    const hoja = wb.Sheets[wb.SheetNames[0]];

    // --- LÓGICA DE PROCESAMIENTO ---
    const regexValidez1 = /VALIDO DESDE\s+(\d{6})\s+HASTA\s+(\d{6})\s+HORA LOCAL/i;
    const matchValidez1 = fullText.match(regexValidez1);
    if (matchValidez1) {
      const h1 = matchValidez1[1] + " HORA LOCAL";
      const h2 = matchValidez1[2] + " HORA LOCAL";
      ["C2","C3","C4","C5"].forEach(c => { if(!hoja[c]) hoja[c]={t:'s'}; hoja[c].v=h1; });
      ["D2","D3","D4","D5"].forEach(c => { if(!hoja[c]) hoja[c]={t:'s'}; hoja[c].v=h2; });
    }

    const matchSinop = fullText.match(/SITUACION SINOPTICA:([\s\S]*?)PRONOSTICO:/i);
    if (matchSinop) {
      const sinop = limpiarTextoPro(matchSinop[1]);
      ["E2","E3","E4","E5"].forEach(c => { if(!hoja[c]) hoja[c]={t:'s'}; hoja[c].v=sinop; });
    }

    const regexSep = /PRONOSTICO VALIDO DESDE\s+(\d{6})\s+HASTA\s+(\d{6})\s+HORA LOCAL\./i;
    const partes = fullText.split(regexSep);
    const periodo1 = partes[0];
    
    if (partes.length >= 4) {
      hoja["L6"] = { t: 's', v: partes[1] };
      hoja["M6"] = { t: 's', v: partes[2] };
      const periodo2 = partes[3];
      const matchCH3_P2 = periodo2.match(/\(CH 3\):([\s\S]*?)(?=MET\d+|EMITIDO:|$)/i);
      if (matchCH3_P2) {
        const bloqueP2 = matchCH3_P2[1];
        const p2p = bloqueP2.split(/VIENTO/i);
        if (p2p.length > 1) {
          hoja["O6"] = { t: 's', v: limpiarTextoPro(p2p[0]) };
          hoja["R6"] = { t: 's', v: limpiarTextoPro(p2p[1], "VIENTO") };
        }
      }
    }

    const zonasCfg = [
      { inicio: "\\(CH 1\\):", fin: "ISLA BUTA CHAUQUES", celdas: ["G3", "H3", "I3", "J3"] },
      { inicio: "\\(CH 2\\):", fin: "BOCA DEL GUAFO", celdas: ["G4", "H4", "I4", "J4"] },
      { inicio: "\\(CH 3\\):", fin: "$", celdas: ["G5", "H5", "I5", "J5"] } 
    ];

    zonasCfg.forEach(z => {
      const r = new RegExp(z.inicio + "([\\s\\S]*?)(?=" + z.fin + "|$)", "i");
      const m = periodo1.match(r);
      if (m) {
        const b = m[1];
        const fieldN = b.match(/([\s\S]*?)VIS/i);
        const fieldVi = b.match(/VIS([\s\S]*?)VIENTO/i);
        const fieldVt = b.match(/VIENTO([\s\S]*?)MAR/i);
        const fieldMa = b.match(/MAR([\s\S]*)$/i);
        if (fieldN) hoja[z.celdas[0]] = { t: 's', v: limpiarTextoPro(fieldN[1]) };
        if (fieldVi) hoja[z.celdas[1]] = { t: 's', v: limpiarTextoPro(fieldVi[1], "VIS") };
        if (fieldVt) hoja[z.celdas[2]] = { t: 's', v: limpiarTextoPro(fieldVt[1], "VIENTO") };
        if (fieldMa) hoja[z.celdas[3]] = { t: 's', v: limpiarBasuraZonas(fieldMa[1]) };
      }
    });

    // Forzar guardado como UTF-8
    if(!wb.Props) wb.Props = {};
    wb.Props.CodePage = 65001; 

    XLSX.writeFile(wb, "6.- Chiloé Oriental.xlsx");
    areaTexto.value = ""; 
    alert("Procesado con éxito");
  };
  reader.readAsArrayBuffer(archivo);
}
</script>

</body>
</html>
